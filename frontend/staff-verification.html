<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DueMate - Verification</title><script src="config.js"></script><link rel="stylesheet" href="app-shell.css?v=20260920"><style>
:root{--ink:#202b38;--muted:#6d7885;--paper:#fffdf8;--line:#e8e1d5;--accent:#087f8c;--accent-dark:#075866;--ok:#198754;--warn:#b7791f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(135deg,#f5efe5,#e6f3ef)}.page{max-width:1150px;margin:0 auto;padding:24px 22px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:25px;font-weight:700;color:var(--accent-dark)}.brand span{color:var(--accent)}.topbar button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:9px 12px;margin-left:6px;cursor:pointer}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font:700 11px Arial,sans-serif}h1{margin:6px 0;font-size:clamp(32px,5vw,54px);font-weight:500}.intro{color:var(--muted);font:14px Arial,sans-serif}.filters{display:flex;gap:10px;margin:22px 0}.filters input,.filters select{padding:11px;border:1px solid var(--line);border-radius:5px;background:#fff}.filters input{flex:1}.item{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:12px;box-shadow:0 12px 32px rgba(47,62,70,.07)}.item h2{font-size:21px;font-weight:500;margin:0 0 7px}.meta{font:13px Arial,sans-serif;color:var(--muted);line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button,.button{border:0;border-radius:5px;padding:10px 13px;background:var(--accent);color:#fff;font:700 12px Arial,sans-serif;cursor:pointer;text-decoration:none}button.secondary,.button.secondary{background:#e5efec;color:var(--accent-dark)}button.warn{background:var(--warn)}.status{display:inline-block;padding:4px 8px;border-radius:12px;background:#e8f4ed;color:var(--ok);font:700 11px Arial,sans-serif}.status.needs_correction{background:#fff1dc;color:var(--warn)}textarea{width:100%;min-height:60px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:5px}.empty{color:var(--muted);font:14px Arial,sans-serif}@media(max-width:650px){.topbar,.filters{align-items:flex-start;flex-direction:column}.filters input,.filters select{width:100%}}
</style></head><body class="staff-page"><div class="background"><div class="grid"></div><div class="glow glow-one"></div><div class="glow glow-two"></div><div class="glow glow-three"></div><div class="study-float book-one">ðŸ“š</div><div class="study-float book-two">ðŸ“–</div><div class="study-float pencil">âœï¸</div><div class="study-float calendar-float">ðŸ“…</div></div><main class="page"><div class="eyebrow">Staff review desk</div><h1>Verification</h1><p class="intro">Open student files, mark viewed, and verify or request corrections.</p><div class="filters"><input id="search" placeholder="Search assignment or student"><select id="status"><option value="">All statuses</option><option value="submitted">Submitted</option><option value="verified">Verified</option><option value="needs_correction">Needs correction</option><option value="completed">Completed</option></select></div><section id="list"><div class="empty">Loading submissions...</div></section></main><script src="app-shell.js?v=20260917"></script><script>
const API=window.API_BASE||'http://localhost:5000';const auth=()=>({Authorization:'Bearer '+sessionStorage.getItem('duemate-token')});let rows=[];function esc(v){return String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const q=document.getElementById('search').value.toLowerCase(),status=document.getElementById('status').value;const data=rows.filter(s=>(!status||s.status===status)&&(s.title+' '+s.student_name+' '+s.student_email).toLowerCase().includes(q));document.getElementById('list').innerHTML=data.length?data.map(s=>`<article class="item"><h2>${esc(s.title)} <span class="status ${esc(s.status)}">${esc(s.status.replace('_',' '))}</span></h2><div class="meta">Student: ${esc(s.student_name)} (${esc(s.student_email)}) Â· Year ${esc(s.year)}<br>Submitted: ${new Date(s.submitted_at).toLocaleString()}<br>File: ${esc(s.file_name)}${s.viewed_at?'<br>Viewed: '+new Date(s.viewed_at).toLocaleString():''}</div><div class="actions"><button class="secondary" onclick="openFile('${esc(s.id)}')">Open submission PDF</button><button class="secondary" onclick="markViewed('${esc(s.id)}')">Mark viewed</button><button onclick="verify('${esc(s.id)}','verified')">Verified</button><button class="warn" onclick="verify('${esc(s.id)}','needs_correction')">Needs Correction</button></div><textarea id="feedback-${esc(s.id)}" placeholder="Remarks for the student">${esc(s.feedback)}</textarea></article>`).join(''):'<div class="empty">No submissions match these filters.</div>'}async function openFile(id){const r=await fetch(API+'/api/assignments/submissions/'+encodeURIComponent(id)+'/file',{headers:auth()});if(!r.ok)return alert('Unable to open submission file.');window.open(URL.createObjectURL(await r.blob()),'_blank','noopener')}async function markViewed(id){const r=await fetch(API+'/api/staff/verifications/'+encodeURIComponent(id)+'/viewed',{method:'PATCH',headers:auth()});if(r.ok){const row=rows.find(x=>x.id===id);if(row)row.viewed_at=new Date().toISOString();render()}}async function verify(id,status){const feedback=document.getElementById('feedback-'+id).value;const r=await fetch(API+'/api/staff/verifications/'+encodeURIComponent(id),{method:'PATCH',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({status,feedback})});const d=await r.json();if(!r.ok)return alert(d.message||'Unable to update verification.');load()}async function load(){try{const r=await fetch(API+'/api/staff/verifications',{headers:auth()}),d=await r.json();if(!r.ok)throw new Error(d.message);rows=d.submissions;render()}catch(e){document.getElementById('list').textContent=e.message}}document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{day:'2-digit',month:'short',weekday:'short'});load();
</script></body></html>
