<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueMate - Verification</title>
    <script src="config.js"></script>
    <link rel="stylesheet" href="app-shell.css?v=20260921">
    <style>
        :root {
            --bg: #f5f6ff;
            --surface: rgba(255,255,255,.72);
            --text: #25263a;
            --muted: #777b91;
            --border: rgba(255,255,255,.9);
            --purple: #756cff;
            --danger: #ff6f91;
            --shadow: rgba(60,66,120,.14);
        }

        body.staff-page {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Segoe UI", Inter, Arial, sans-serif;
        }

        body.staff-page.dark {
            --bg: #0b1020;
            --surface: rgba(20,26,49,.72);
            --text: #f4f5ff;
            --muted: #aeb3ca;
            --border: rgba(255,255,255,.09);
            --purple: #958cff;
            --danger: #ff91bf;
            --shadow: rgba(0,0,0,.42);
        }

        .verification-page {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 0 22px 70px;
        }

        .verification-heading {
            margin: 0 0 24px;
        }

        .eyebrow {
            margin-bottom: 8px;
            color: var(--purple);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.08;
            letter-spacing: 0;
        }

        .intro {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .verification-filters {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 12px;
            margin-bottom: 22px;
        }

        .verification-filters input,
        .verification-filters select,
        .feedback {
            width: 100%;
            border: 1px solid rgba(120,125,160,.18);
            border-radius: 12px;
            padding: 12px 13px;
            outline: none;
            color: var(--text);
            background: rgba(120,125,160,.055);
            font: 12px "Segoe UI", Arial, sans-serif;
        }

        .verification-filters input:focus,
        .verification-filters select:focus,
        .feedback:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(117,108,255,.12);
        }

        .verification-list {
            display: grid;
            gap: 14px;
        }

        .verification-item {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 18px 45px var(--shadow);
            backdrop-filter: blur(18px);
        }

        .verification-item h2 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 16px;
        }

        .meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-left: 6px;
            border-radius: 9px;
            padding: 4px 7px;
            color: #159b78;
            background: rgba(85,213,176,.13);
            font-size: 10px;
            font-weight: 800;
            text-transform: capitalize;
        }

        .status.needs_correction { color: #b78616; background: rgba(255,215,107,.18); }

        .feedback {
            min-height: 74px;
            margin-top: 12px;
            resize: vertical;
        }

        .verification-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .verification-actions button,
        .verification-error button {
            border: 0;
            border-radius: 12px;
            padding: 10px 13px;
            cursor: pointer;
            color: #fff;
            background: var(--purple);
            font: 800 11px "Segoe UI", Arial, sans-serif;
        }

        .verification-actions button.secondary {
            color: var(--purple);
            background: rgba(117,108,255,.1);
        }

        .verification-actions button.warn {
            background: var(--danger);
        }

        button:disabled { cursor: wait; opacity: .55; }

        .verification-empty,
        .verification-error {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .verification-error {
            display: grid;
            gap: 12px;
        }

        @media (max-width: 700px) {
            .verification-page { padding: 0 14px 50px; }
            .verification-filters { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="staff-page">
    <div class="background" aria-hidden="true">
        <div class="grid"></div>
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>
        <div class="study-float book-one">📚</div>
        <div class="study-float book-two">📖</div>
        <div class="study-float pencil">✏️</div>
        <div class="study-float calendar-float">📅</div>
    </div>

    <main class="verification-page">
        <header class="verification-heading">
            <div class="eyebrow">Staff review desk</div>
            <h1>Verification</h1>
            <p class="intro">Open student files, mark viewed, and verify or request corrections.</p>
        </header>

        <div class="verification-filters">
            <input id="search" type="search" placeholder="Search assignment or student" aria-label="Search assignment or student">
            <select id="status" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="submitted">Submitted</option>
                <option value="resubmitted">Resubmitted</option>
                <option value="verified">Verified</option>
                <option value="needs_correction">Needs correction</option>
            </select>
        </div>

        <section id="list" class="verification-list" aria-live="polite">
            <div class="verification-empty">Loading submissions...</div>
        </section>
    </main>

    <script src="app-shell.js?v=20260921"></script>
    <script>
        const API = window.API_BASE || "http://localhost:5000";
        const list = document.getElementById("list");
        const search = document.getElementById("search");
        const statusFilter = document.getElementById("status");
        let submissions = [];

        function authHeaders() {
            return { Authorization: "Bearer " + (sessionStorage.getItem("duemate-token") || "") };
        }

        async function readResponse(response) {
            const text = await response.text();
            if (!text) return {};
            try { return JSON.parse(text); } catch (_) { return { message: text.trim() }; }
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>\"]/g, character => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
            }[character]));
        }

        function statusLabel(status) {
            return ({
                submitted: "Submitted - Under Verification",
                resubmitted: "Resubmitted - Under Verification",
                verified: "Verified - Accepted",
                needs_correction: "Correction Required"
            }[status] || status || "Unknown");
        }

        function filteredSubmissions() {
            const query = search.value.trim().toLowerCase();
            const selectedStatus = statusFilter.value;
            return submissions.filter(submission => {
                const haystack = [submission.title, submission.student_name, submission.student_email].join(" ").toLowerCase();
                return (!query || haystack.includes(query)) && (!selectedStatus || submission.status === selectedStatus);
            });
        }

        function render() {
            const visible = filteredSubmissions();
            if (!visible.length) {
                list.innerHTML = '<div class="verification-empty">No submissions match these filters.</div>';
                return;
            }

            list.innerHTML = visible.map(submission => {
                const waiting = ["submitted", "resubmitted"].includes(submission.status);
                const feedback = escapeHtml(submission.feedback || "");
                return `<article class="verification-item">
                    <h2>${escapeHtml(submission.title)} <span class="status ${escapeHtml(submission.status)}">${escapeHtml(statusLabel(submission.status))}</span></h2>
                    <div class="meta">Student: ${escapeHtml(submission.student_name)} (${escapeHtml(submission.student_email)})<br>
                    Year: ${escapeHtml(submission.student_year || "Not provided")}<br>
                    Submitted: ${new Date(submission.submitted_at).toLocaleString()}<br>
                    File: ${escapeHtml(submission.file_name)}${submission.viewed_at ? "<br>Viewed: " + new Date(submission.viewed_at).toLocaleString() : ""}</div>
                    <div class="verification-actions">
                        <button class="secondary" type="button" data-action="open" data-id="${escapeHtml(submission.id)}">Open submission</button>
                        <button class="secondary" type="button" data-action="viewed" data-id="${escapeHtml(submission.id)}">Mark viewed</button>
                        ${waiting ? `<button type="button" data-action="verify" data-status="verified" data-id="${escapeHtml(submission.id)}">Accept / Verify</button>
                        <button class="warn" type="button" data-action="verify" data-status="needs_correction" data-id="${escapeHtml(submission.id)}">Request Correction</button>` : ""}
                    </div>
                    <textarea class="feedback" data-feedback="${escapeHtml(submission.id)}" placeholder="Remarks for the student">${feedback}</textarea>
                </article>`;
            }).join("");
        }

        async function load() {
            list.innerHTML = '<div class="verification-empty">Loading submissions...</div>';
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(API + "/api/staff/verifications", { headers: authHeaders(), signal: controller.signal });
                clearTimeout(timeout);
                const data = await readResponse(response);
                if (response.status === 401) {
                    sessionStorage.clear();
                    window.location.href = "index.html?redirect=staff-verification";
                    return;
                }
                if (!response.ok) throw new Error(data.message || "Unable to load verifications.");
                submissions = data.submissions || [];
                render();
            } catch (error) {
                const message = error.name === "AbortError" ? "Verification service timed out. Check the backend and retry." : (error.message || "Unable to load verifications.");
                list.innerHTML = `<div class="verification-error"><span>${escapeHtml(message)}</span><button type="button" data-action="retry">Retry</button></div>`;
            }
        }

        async function openSubmission(id) {
            const response = await fetch(API + "/api/assignments/submissions/" + encodeURIComponent(id) + "/file", { headers: authHeaders() });
            if (!response.ok) { alert("Unable to open submission file."); return; }
            const url = URL.createObjectURL(await response.blob());
            window.open(url, "_blank", "noopener");
        }

        async function markViewed(id) {
            const response = await fetch(API + "/api/staff/verifications/" + encodeURIComponent(id) + "/viewed", { method: "PATCH", headers: authHeaders() });
            const data = await readResponse(response);
            if (!response.ok) { alert(data.message || "Unable to mark submission viewed."); return; }
            const submission = submissions.find(item => String(item.id) === String(id));
            if (submission) submission.viewed_at = new Date().toISOString();
            render();
        }

        async function verify(id, nextStatus) {
            const field = document.querySelector(`[data-feedback="${CSS.escape(String(id))}"]`);
            const response = await fetch(API + "/api/staff/verifications/" + encodeURIComponent(id), {
                method: "PATCH",
                headers: { ...authHeaders(), "Content-Type": "application/json" },
                body: JSON.stringify({ status: nextStatus, feedback: field ? field.value : "" })
            });
            const data = await readResponse(response);
            if (!response.ok) { alert(data.message || "Unable to update verification."); return; }
            await load();
        }

        list.addEventListener("click", event => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const action = button.dataset.action;
            if (action === "retry") load();
            if (action === "open") openSubmission(button.dataset.id);
            if (action === "viewed") markViewed(button.dataset.id);
            if (action === "verify") verify(button.dataset.id, button.dataset.status);
        });
        search.addEventListener("input", render);
        statusFilter.addEventListener("change", render);
        load();
    </script>
</body>
</html>
