<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DueMate - Subjects</title>


    <style>

        /* =====================================================
           DUE MATE
           SUBJECTS PAGE
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           THEME VARIABLES
           ===================================================== */

        :root {

            --bg: #f5f6ff;

            --surface:
                rgba(255, 255, 255, 0.72);

            --surface-solid:
                #ffffff;

            --text:
                #25263a;

            --muted:
                #777b91;

            --border:
                rgba(255, 255, 255, 0.9);

            --purple:
                #756cff;

            --blue:
                #5d9cff;

            --pink:
                #ff86b6;

            --mint:
                #55d5b0;

            --yellow:
                #ffd76b;

            --red:
                #ff6f91;

            --grid:
                rgba(91, 99, 150, 0.055);

            --shadow:
                rgba(60, 66, 120, 0.14);
        }


        /* =====================================================
           DARK THEME
           ===================================================== */

        body.dark {

            --bg:
                #0b1020;

            --surface:
                rgba(20, 26, 49, 0.72);

            --surface-solid:
                #151b32;

            --text:
                #f4f5ff;

            --muted:
                #aeb3ca;

            --border:
                rgba(255, 255, 255, 0.09);

            --purple:
                #958cff;

            --blue:
                #73adff;

            --pink:
                #ff91bf;

            --mint:
                #64dfc0;

            --yellow:
                #ffe08a;

            --red:
                #ff7898;

            --grid:
                rgba(185, 195, 255, 0.035);

            --shadow:
                rgba(0, 0, 0, 0.42);
        }


        /* =====================================================
           BODY
           ===================================================== */

        body {

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                "Segoe UI",
                Inter,
                Arial,
                sans-serif;

            color:
                var(--text);

            background:
                var(--bg);

            transition:
                background 0.6s ease,
                color 0.6s ease;
        }


        button,
        input,
        textarea,
        select {

            font: inherit;
        }


        button {

            cursor: pointer;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .background {

            position: fixed;

            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                var(--bg);
        }


        .grid {

            position: absolute;

            inset: -100px;

            background-image:

                linear-gradient(
                    var(--grid) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    var(--grid) 1px,
                    transparent 1px
                );

            background-size: 44px 44px;

            transform:
                perspective(500px)
                rotateX(55deg)
                scale(1.4);

            transform-origin:
                center bottom;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 5%,
                    black 35%,
                    black 75%,
                    transparent 100%
                );

            animation:
                gridMove 30s linear infinite;
        }


        @keyframes gridMove {

            from {

                background-position:
                    0 0,
                    0 0;
            }

            to {

                background-position:
                    44px 44px,
                    44px 44px;
            }
        }


        /* =====================================================
           GLOWS
           ===================================================== */

        .glow {

            position: absolute;

            border-radius: 50%;

            filter: blur(85px);

            pointer-events: none;

            opacity: 0.28;
        }


        .glow-one {

            width: 430px;

            height: 430px;

            left: -170px;

            top: -160px;

            background:
                var(--purple);

            animation:
                glowOne 18s ease-in-out infinite alternate;
        }


        .glow-two {

            width: 400px;

            height: 400px;

            right: -170px;

            top: 25%;

            background:
                var(--mint);

            animation:
                glowTwo 22s ease-in-out infinite alternate;
        }


        .glow-three {

            width: 380px;

            height: 380px;

            left: 35%;

            bottom: -220px;

            background:
                var(--pink);

            animation:
                glowThree 25s ease-in-out infinite alternate;
        }


        @keyframes glowOne {

            from {

                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {

                transform:
                    translate(240px, 230px)
                    scale(1.15);
            }
        }


        @keyframes glowTwo {

            from {

                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {

                transform:
                    translate(-220px, 130px)
                    scale(1.12);
            }
        }


        @keyframes glowThree {

            from {

                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {

                transform:
                    translate(180px, -130px)
                    scale(1.1);
            }
        }


        /* =====================================================
           FLOATING STUDY ELEMENTS
           ===================================================== */

        .study-float {

            position: absolute;

            pointer-events: none;

            user-select: none;

            opacity: 0.18;

            animation:
                studyFloat 10s ease-in-out infinite;
        }


        .book-one {

            left: 7%;

            top: 20%;

            font-size: 32px;
        }


        .book-two {

            right: 7%;

            bottom: 18%;

            font-size: 30px;

            animation-delay: -4s;
        }


        .pencil {

            left: 48%;

            top: 12%;

            font-size: 26px;

            animation-delay: -7s;
        }


        .calendar-float {

            right: 18%;

            top: 65%;

            font-size: 27px;

            animation-delay: -2s;
        }


        @keyframes studyFloat {

            0%,
            100% {

                transform:
                    translate3d(0, 0, 0)
                    rotate(-5deg);
            }

            50% {

                transform:
                    translate3d(10px, -18px, 0)
                    rotate(7deg);
            }
        }


        /* =====================================================
           PARTICLES
           ===================================================== */

        .particles {

            position: absolute;

            inset: 0;

            pointer-events: none;
        }


        .particle {

            position: absolute;

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background:
                var(--purple);

            opacity: 0.3;

            animation:
                particleFloat 16s linear infinite;
        }


        .particle:nth-child(1) {
            left: 8%;
            top: 80%;
            animation-duration: 15s;
        }


        .particle:nth-child(2) {
            left: 22%;
            top: 72%;
            animation-duration: 18s;
        }


        .particle:nth-child(3) {
            left: 40%;
            top: 88%;
            animation-duration: 14s;
        }


        .particle:nth-child(4) {
            left: 58%;
            top: 80%;
            animation-duration: 20s;
        }


        .particle:nth-child(5) {
            left: 76%;
            top: 84%;
            animation-duration: 17s;
        }


        .particle:nth-child(6) {
            left: 91%;
            top: 72%;
            animation-duration: 16s;
        }


        @keyframes particleFloat {

            0% {

                transform:
                    translateY(80px)
                    scale(0);

                opacity: 0;
            }

            20% {

                opacity: 0.35;
            }

            70% {

                transform:
                    translateY(-220px)
                    translateX(35px)
                    scale(1);
            }

            100% {

                transform:
                    translateY(-430px)
                    translateX(-25px)
                    scale(0);

                opacity: 0;
            }
        }


        /* =====================================================
           DARK MODE STARS
           ===================================================== */

        .stars {

            position: absolute;

            inset: 0;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.7s ease;
        }


        body.dark .stars {

            opacity: 1;
        }


        .star {

            position: absolute;

            width: 2px;

            height: 2px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 8px white;

            animation:
                twinkle 4s ease-in-out infinite;
        }


        .star:nth-child(1) {
            left: 7%;
            top: 12%;
        }

        .star:nth-child(2) {
            left: 18%;
            top: 30%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 30%;
            top: 9%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 44%;
            top: 20%;
            animation-delay: 0.7s;
        }

        .star:nth-child(5) {
            left: 57%;
            top: 12%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 71%;
            top: 22%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 86%;
            top: 11%;
            animation-delay: 1.1s;
        }

        .star:nth-child(8) {
            left: 94%;
            top: 38%;
            animation-delay: 2.8s;
        }

        .star:nth-child(9) {
            left: 80%;
            top: 68%;
            animation-delay: 1.8s;
        }

        .star:nth-child(10) {
            left: 55%;
            top: 78%;
            animation-delay: 2.4s;
        }


        @keyframes twinkle {

            0%,
            100% {

                opacity: 0.15;

                transform:
                    scale(0.7);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.7);
            }
        }


        /* =====================================================
           APP
           ===================================================== */

        .app {

            width:
                min(1250px, 94%);

            margin:
                0 auto;

            padding:
                22px 0 60px;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

            margin-bottom: 28px;
        }


        .left-top {

            display: flex;

            align-items: center;

            gap: 14px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar .menu-btn,
        .topbar .calendar-btn,
        .topbar .notification-btn {

            width: 45px;

            height: 45px;

            border:
                1px solid var(--border);

            border-radius: 14px;

            background:
                var(--surface);

            color:
                var(--text);

            font-size: 20px;

            box-shadow:
                0 12px 30px var(--shadow);

            backdrop-filter:
                blur(15px);

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .topbar .calendar-btn {
            width: auto;
            min-width: 132px;
            padding: 0 12px;
            position: relative;
        }

        .topbar .calendar-date-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 800;
        }

        .topbar .menu-btn:hover,
        .topbar .calendar-btn:hover,
        .topbar .notification-btn:hover {

            transform:
                translateY(-2px);
            background: rgba(117,108,255,0.08);
        }


        .brand {

            font-size: 26px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        .brand span {

            color:
                var(--purple);
        }


        /* =====================================================
           DATE
           ===================================================== */

        .top-date {

            padding:
                11px 17px;

            border:
                1px solid var(--border);

            border-radius: 15px;

            background:
                var(--surface);

            color:
                var(--muted);

            font-size: 13px;

            box-shadow:
                0 12px 30px var(--shadow);

            backdrop-filter:
                blur(15px);

            cursor: pointer;

            transition:
                transform 0.25s ease;
        }


        .top-date:hover {

            transform:
                translateY(-2px);
        }


        .top-date strong {

            color:
                var(--text);
        }


        /* =====================================================
           NOTIFICATION
           ===================================================== */

        .notification-btn {

            position:
                relative;
        }


        .notification-dot {

            position: absolute;

            width: 7px;

            height: 7px;

            right: 9px;

            top: 8px;

            border-radius: 50%;

            background:
                var(--pink);

            box-shadow:
                0 0 10px var(--pink);
        }


        /* =====================================================
           PAGE HEADER
           ===================================================== */

        .page-header {

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom:
                24px;
        }


        .page-title h1 {

            font-size:
                clamp(30px, 5vw, 44px);

            line-height:
                1.08;

            letter-spacing:
                -1.5px;

            margin-bottom:
                8px;
        }


        .page-title p {

            color:
                var(--muted);

            font-size:
                14px;

            line-height:
                1.5;
        }


        /* =====================================================
           ADD BUTTON
           ===================================================== */

        .add-subject-btn {

            display:
                flex;

            align-items:
                center;

            gap: 9px;

            padding:
                13px 18px;

            border:
                0;

            border-radius:
                14px;

            background:
                var(--purple);

            color:
                white;

            font-weight:
                800;

            font-size:
                12px;

            box-shadow:
                0 12px 28px
                rgba(117, 108, 255, 0.25);

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }


        .add-subject-btn:hover {

            transform:
                translateY(-2px);

            opacity:
                0.92;
        }


        /* =====================================================
           SEARCH BAR
           ===================================================== */

        .search-section {

            margin-bottom:
                22px;
        }


        .search-box {

            position:
                relative;
        }


        .search-box span {

            position:
                absolute;

            left:
                15px;

            top:
                50%;

            transform:
                translateY(-50%);

            font-size:
                17px;

            pointer-events:
                none;
        }


        .search-box input {

            width:
                100%;

            padding:
                14px 16px 14px 45px;

            border:
                1px solid var(--border);

            border-radius:
                16px;

            outline:
                none;

            background:
                var(--surface);

            color:
                var(--text);

            box-shadow:
                0 12px 30px var(--shadow);

            backdrop-filter:
                blur(15px);

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease;
        }


        .search-box input:focus {

            border-color:
                var(--purple);

            box-shadow:
                0 0 0 3px
                rgba(117, 108, 255, 0.1);
        }


        .search-box input::placeholder {

            color:
                var(--muted);
        }


        /* =====================================================
           SUBJECT GRID
           ===================================================== */

        .subjects-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap:
                18px;
        }


        /* =====================================================
           SUBJECT CARD
           ===================================================== */

        .subject-card {

            position:
                relative;

            overflow:
                hidden;

            min-height:
                235px;

            padding:
                20px;

            border:
                1px solid var(--border);

            border-radius:
                22px;

            background:
                var(--surface);

            box-shadow:
                0 18px 45px var(--shadow);

            backdrop-filter:
                blur(18px);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .subject-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 23px 50px var(--shadow);
        }


        .subject-card::before {

            content:
                "";

            position:
                absolute;

            width:
                150px;

            height:
                150px;

            right:
                -70px;

            top:
                -70px;

            border-radius:
                50%;

            background:
                var(--card-color, var(--purple));

            opacity:
                0.11;

            filter:
                blur(8px);
        }


        .subject-card-top {

            position:
                relative;

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                12px;

            margin-bottom:
                17px;
        }


        .subject-icon {

            width:
                48px;

            height:
                48px;

            display:
                grid;

            place-items:
                center;

            flex-shrink:
                0;

            border-radius:
                15px;

            background:
                color-mix(
                    in srgb,
                    var(--card-color, var(--purple)) 13%,
                    transparent
                );

            font-size:
                22px;
        }


        .subject-actions {

            display:
                flex;

            gap:
                6px;
        }


        .subject-action {

            width:
                32px;

            height:
                32px;

            border:
                0;

            border-radius:
                9px;

            background:
                rgba(120, 125, 160, 0.08);

            color:
                var(--text);

            font-size:
                13px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .subject-action:hover {

            background:
                rgba(117, 108, 255, 0.12);

            transform:
                translateY(-1px);
        }


        .subject-action.delete:hover {

            background:
                rgba(255, 111, 145, 0.13);

            color:
                var(--red);
        }


        .subject-name {

            position:
                relative;

            font-size:
                18px;

            font-weight:
                800;

            line-height:
                1.25;

            margin-bottom:
                5px;

            word-break:
                break-word;
        }


        .subject-code {

            position:
                relative;

            color:
                var(--card-color, var(--purple));

            font-size:
                11px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                0.7px;
        }


        .subject-info {

            position:
                relative;

            display:
                flex;

            flex-direction:
                column;

            gap:
                9px;

            margin-top:
                17px;
        }


        .info-row {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            color:
                var(--muted);

            font-size:
                11px;
        }


        .info-row-icon {

            width:
                28px;

            height:
                28px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                9px;

            background:
                rgba(120, 125, 160, 0.08);

            flex-shrink:
                0;

            font-size:
                13px;
        }


        .subject-notes {

            position:
                relative;

            margin-top:
                15px;

            padding-top:
                12px;

            border-top:
                1px solid
                rgba(120, 125, 160, 0.1);

            color:
                var(--muted);

            font-size:
                10px;

            line-height:
                1.5;

            display:
                -webkit-box;

            -webkit-line-clamp:
                2;

            -webkit-box-orient:
                vertical;

            overflow:
                hidden;
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-state {

            grid-column:
                1 / -1;

            min-height:
                330px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                35px;

            border:
                1px solid var(--border);

            border-radius:
                24px;

            background:
                var(--surface);

            box-shadow:
                0 18px 45px var(--shadow);

            backdrop-filter:
                blur(18px);
        }


        .empty-icon {

            width:
                70px;

            height:
                70px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                21px;

            background:
                rgba(117, 108, 255, 0.1);

            font-size:
                30px;

            margin-bottom:
                15px;
        }


        .empty-state h3 {

            font-size:
                18px;

            margin-bottom:
                7px;
        }


        .empty-state p {

            max-width:
                380px;

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.6;

            margin-bottom:
                18px;
        }


        .empty-add-btn {

            padding:
                11px 16px;

            border:
                0;

            border-radius:
                12px;

            background:
                var(--purple);

            color:
                white;

            font-size:
                11px;

            font-weight:
                800;
        }


        /* =====================================================
           MODAL OVERLAY
           ===================================================== */

        .modal-overlay {

            position:
                fixed;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(7, 10, 22, 0.48);

            backdrop-filter:
                blur(7px);

            opacity:
                0;

            visibility:
                hidden;

            transition:
                opacity 0.3s ease;

            z-index:
                400;
        }


        .modal-overlay.show {

            opacity:
                1;

            visibility:
                visible;
        }


        /* =====================================================
           MODAL
           ===================================================== */

        .modal {

            width:
                min(520px, 100%);

            max-height:
                90vh;

            overflow-y:
                auto;

            padding:
                25px;

            border:
                1px solid var(--border);

            border-radius:
                24px;

            background:
                var(--surface-solid);

            color:
                var(--text);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.25);

            transform:
                translateY(20px)
                scale(0.97);

            transition:
                transform 0.3s ease;
        }


        .modal-overlay.show .modal {

            transform:
                translateY(0)
                scale(1);
        }


        .modal-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                22px;
        }


        .modal-header h2 {

            font-size:
                21px;
        }


        .modal-header p {

            color:
                var(--muted);

            font-size:
                11px;

            margin-top:
                4px;
        }


        .modal-close {

            width:
                36px;

            height:
                36px;

            border:
                0;

            border-radius:
                10px;

            background:
                rgba(120, 125, 160, 0.1);

            color:
                var(--text);

            font-size:
                18px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {

            margin-bottom:
                16px;
        }


        .form-group label {

            display:
                block;

            margin-bottom:
                7px;

            font-size:
                11px;

            font-weight:
                800;
        }


        .required {

            color:
                var(--red);
        }


        .form-control {

            width:
                100%;

            padding:
                12px 13px;

            border:
                1px solid
                rgba(120, 125, 160, 0.16);

            border-radius:
                12px;

            outline:
                none;

            background:
                rgba(120, 125, 160, 0.055);

            color:
                var(--text);

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-control:focus {

            border-color:
                var(--purple);

            box-shadow:
                0 0 0 3px
                rgba(117, 108, 255, 0.1);
        }


        .form-control::placeholder {

            color:
                var(--muted);
        }


        textarea.form-control {

            min-height:
                90px;

            resize:
                vertical;
        }


        .form-row {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                12px;
        }


        /* =====================================================
           COLOR PICKER
           ===================================================== */

        .color-options {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                9px;
        }


        .color-option {

            width:
                30px;

            height:
                30px;

            border-radius:
                50%;

            border:
                3px solid transparent;

            outline:
                2px solid transparent;

            cursor:
                pointer;

            transition:
                transform 0.2s ease,
                outline 0.2s ease;
        }


        .color-option:hover {

            transform:
                scale(1.1);
        }


        .color-option.selected {

            outline:
                2px solid var(--text);

            outline-offset:
                2px;
        }


        .color-purple {
            background: #756cff;

        .color-blue {

           FORM ACTIONS
           ===================================================== */

        /* =====================================================
           DRAWER
           ===================================================== */

        .drawer-overlay {

            position:
                fixed;

            inset:
                0;

            background:

            backdrop-filter:

            left:

    <script>

        /* =====================================================
           THEME
           ===================================================== */

        function applySavedTheme() {

            const savedTheme =
                localStorage.getItem("duemate-theme") || "light";


            if (savedTheme === "dark") {

                document.body.classList.add("dark");

            } else {

                document.body.classList.remove("dark");
            }
        }


        applySavedTheme();



        /* =====================================================
           DATE
           ===================================================== */

        function formatShortDate(date) {

            return date.toLocaleDateString(
                undefined,
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );
        }


        function updateDate() {

            const currentDate =
                document.getElementById(
                    "currentDate"
                );


            if (currentDate) {

                currentDate.textContent =
                    formatShortDate(
                        new Date()
                    );
            }
        }


        updateDate();



        /* =====================================================
           STORAGE KEY
           ===================================================== */

        function getUserEmail() {

            const directEmail = sessionStorage.getItem("duemate-user-email");

            if (directEmail) {
                return directEmail.trim().toLowerCase();
            }

            for (const key of ["duemate-user", "dueMateUser"]) {
                try {
                    const user = JSON.parse(sessionStorage.getItem(key) || "null");
                    const email = user && (user.email || user.user_email);

                    if (email) {
                        return String(email).trim().toLowerCase();
                    }
                }
                catch {
                    continue;
                }
            }

            return "";
        }


        function getSubjectStorageKey() {

            const email = getUserEmail();

            if (!email) {
                return null;
            }

            return (
                "duemate-subjects-" +
                encodeURIComponent(email)
            );
        }



        /* =====================================================
           SUBJECT DATA
           ===================================================== */

        let subjects = [];

        let editingSubjectId = null;

        let selectedColor = "#756cff";



        /* =====================================================
           LOAD SUBJECTS
           ===================================================== */

        function loadSubjects() {

            const storageKey = getSubjectStorageKey();

            if (!storageKey) {
                subjects = [];
                return;
            }

            try {

                const stored =
                    localStorage.getItem(
                        storageKey
                    );


                if (!stored) {

                    const legacyStored =
                        sessionStorage.getItem("duemate-subjects-" + getUserEmail());

                    if (legacyStored) {
                        localStorage.setItem(storageKey, legacyStored);
                    }

                    subjects = legacyStored
                        ? JSON.parse(legacyStored)
                        : [];

                    return;
                }


                const parsed =
                    JSON.parse(stored);


                if (Array.isArray(parsed)) {

                    subjects = parsed;

                } else {

                    subjects = [];
                }

            } catch (error) {

                console.error(
                    "Unable to load subjects:",
                    error
                );

                subjects = [];
            }
        }



        /* =====================================================
           SAVE SUBJECTS
           ===================================================== */

        function saveSubjectsToStorage() {

            const storageKey = getSubjectStorageKey();

            if (!storageKey) {
                return;
            }

            localStorage.setItem(
                storageKey,
                JSON.stringify(subjects)
            );
        }



        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHTML(value) {

            const div =
                document.createElement("div");


            div.textContent =
                String(value ?? "");


            return div.innerHTML;
        }



        /* =====================================================
           RENDER SUBJECTS
           ===================================================== */

        function renderSubjects(list = subjects) {

            const grid =
                document.getElementById(
                    "subjectsGrid"
                );


            if (!grid) {

                return;
            }


            if (!list.length) {

                const hasSearch =
                    document.getElementById(
                        "searchInput"
                    )?.value.trim();


                if (hasSearch) {

                    grid.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                🔎
                            </div>

                            <h3>
                                No subjects found
                            </h3>

                            <p>
                                Try a different subject name,
                                code or faculty name.
                            </p>

                        </div>

                    `;

                } else {

                    grid.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                📚
                            </div>

                            <h3>
                                No subjects added yet
                            </h3>

                            <p>
                                Add your first subject to start
                                organizing your academic work.
                            </p>

                            <button
                                class="empty-add-btn"
                                type="button"
                                onclick="openAddModal()">

                                ＋ Add Your First Subject

                            </button>

                        </div>

                    `;
                }

                return;
            }


            grid.innerHTML =
                list.map(
                    function(subject) {

                        return `

                            <article
                                class="subject-card"
                                style="--card-color:${escapeHTML(subject.color || "#756cff")}">


                                <div class="subject-card-top">


                                    <div class="subject-icon">

                                        📚

                                    </div>


                                    <div class="subject-actions">


                                        <button
                                            class="subject-action"
                                            type="button"
                                            title="Edit subject"
                                            aria-label="Edit subject"
                                            onclick="editSubject('${escapeHTML(subject.id)}')">

                                            ✏️

                                        </button>


                                        <button
                                            class="subject-action delete"
                                            type="button"
                                            title="Delete subject"
                                            aria-label="Delete subject"
                                            onclick="deleteSubject('${escapeHTML(subject.id)}')">

                                            🗑️

                                        </button>

                                    </div>

                                </div>



                                <div class="subject-name">

                                    ${escapeHTML(subject.name)}

                                </div>


                                ${
                                    subject.code
                                    ?
                                    `
                                    <div class="subject-code">

                                        ${escapeHTML(subject.code)}

                                    </div>
                                    `
                                    :
                                    ""
                                }



                                <div class="subject-info">


                                    ${
                                        subject.faculty
                                        ?
                                        `
                                        <div class="info-row">

                                            <span class="info-row-icon">
                                                👨‍🏫
                                            </span>

                                            <span>
                                                ${escapeHTML(subject.faculty)}
                                            </span>

                                        </div>
                                        `
                                        :
                                        ""
                                    }


                                    <div class="info-row">

                                        <span class="info-row-icon">
                                            📌
                                        </span>

                                        <span>
                                            Academic Subject
                                        </span>

                                    </div>

                                </div>



                                ${
                                    subject.notes
                                    ?
                                    `
                                    <div class="subject-notes">

                                        📝 ${escapeHTML(subject.notes)}

                                    </div>
                                    `
                                    :
                                    ""
                                }

                            </article>

                        `;
                    }
                ).join("");
        }



        /* =====================================================
           OPEN ADD MODAL
           ===================================================== */

        function openAddModal() {

            editingSubjectId = null;

            const modalTitle =
                document.getElementById(
                    "modalTitle"
                );


            if (modalTitle) {

                modalTitle.textContent =
                    "Add Subject";
            }


            resetSubjectForm();


            const modal =
                document.getElementById(
                    "subjectModal"
                );


            if (modal) {

                modal.classList.add("show");
            }


            setTimeout(
                function() {

                    const input =
                        document.getElementById(
                            "subjectName"
                        );


                    if (input) {

                        input.focus();
                    }

                },
                100
            );
        }



        /* =====================================================
           EDIT SUBJECT
           ===================================================== */

        function editSubject(id) {

            const subject =
                subjects.find(
                    function(item) {

                        return item.id === id;
                    }
                );


            if (!subject) {

                return;
            }


            editingSubjectId =
                id;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Subject";


            document.getElementById(
                "subjectName"
            ).value =
                subject.name || "";


            document.getElementById(
                "subjectCode"
            ).value =
                subject.code || "";


            document.getElementById(
                "facultyName"
            ).value =
                subject.faculty || "";


            document.getElementById(
                "subjectNotes"
            ).value =
                subject.notes || "";


            selectedColor =
                subject.color || "#756cff";


            updateColorSelection();


            document.getElementById(
                "subjectModal"
            ).classList.add("show");


            setTimeout(
                function() {

                    document.getElementById(
                        "subjectName"
                    ).focus();

                },
                100
            );
        }



        /* =====================================================
           CLOSE MODAL
           ===================================================== */

        function closeSubjectModal() {

            const modal =
                document.getElementById(
                    "subjectModal"
                );


            if (modal) {

                modal.classList.remove("show");
            }


            editingSubjectId = null;

            resetSubjectForm();
        }



        /* =====================================================
           RESET FORM
           ===================================================== */

        function resetSubjectForm() {

            const form =
                document.getElementById(
                    "subjectForm"
                );


            if (form) {

                form.reset();
            }


            selectedColor =
                "#756cff";


            updateColorSelection();
        }



        /* =====================================================
           COLOR SELECTION
           ===================================================== */

        function selectColor(element) {

            if (!element) {

                return;
            }


            selectedColor =
                element.dataset.color ||
                "#756cff";


            updateColorSelection();
        }


        function updateColorSelection() {

            const options =
                document.querySelectorAll(
                    ".color-option"
                );


            options.forEach(
                function(option) {

                    if (
                        option.dataset.color ===
                        selectedColor
                    ) {

                        option.classList.add(
                            "selected"
                        );

                    } else {

                        option.classList.remove(
                            "selected"
                        );
                    }
                }
            );
        }



        /* =====================================================
           SAVE SUBJECT
           ===================================================== */

        function saveSubject(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "subjectName"
                ).value.trim();


            const code =
                document.getElementById(
                    "subjectCode"
                ).value.trim();


            const faculty =
                document.getElementById(
                    "facultyName"
                ).value.trim();


            const notes =
                document.getElementById(
                    "subjectNotes"
                ).value.trim();


            if (!name) {

                showToast(
                    "Please enter the subject name."
                );

                document.getElementById(
                    "subjectName"
                ).focus();

                return;
            }


            const duplicate =
                subjects.some(
                    function(subject) {

                        const sameName =
                            subject.name
                                .toLowerCase() ===
                            name.toLowerCase();


                        return (
                            sameName &&
                            subject.id !==
                                editingSubjectId
                        );
                    }
                );


            if (duplicate) {

                showToast(
                    "This subject already exists."
                );

                return;
            }


            if (editingSubjectId) {

                const index =
                    subjects.findIndex(
                        function(subject) {

                            return (
                                subject.id ===
                                editingSubjectId
                            );
                        }
                    );


                if (index !== -1) {

                    subjects[index] = {

                        ...subjects[index],

                        name:
                            name,

                        code:
                            code,

                        faculty:
                            faculty,

                        notes:
                            notes,

                        color:
                            selectedColor,

                        updatedAt:
                            new Date().toISOString()
                    };
                }


                showToast(
                    "Subject updated successfully."
                );

            } else {

                const newSubject = {

                    id:
                        createSubjectId(),

                    name:
                        name,

                    code:
                        code,

                    faculty:
                        faculty,

                    notes:
                        notes,

                    color:
                        selectedColor,

                    createdAt:
                        new Date().toISOString()
                };


                subjects.unshift(
                    newSubject
                );


                showToast(
                    "Subject added successfully."
                );
            }


            saveSubjectsToStorage();

            renderSubjects();

            closeSubjectModal();
        }



        /* =====================================================
           CREATE ID
           ===================================================== */

        function createSubjectId() {

            return (
                "subject-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 9)
            );
        }



        /* =====================================================
           DELETE SUBJECT
           ===================================================== */

        function deleteSubject(id) {

            const subject =
                subjects.find(
                    function(item) {

                        return item.id === id;
                    }
                );


            if (!subject) {

                return;
            }


            const confirmed =
                confirm(
                    `Delete "${subject.name}"?`
                );


            if (!confirmed) {

                return;
            }


            subjects =
                subjects.filter(
                    function(item) {

                        return item.id !== id;
                    }
                );


            saveSubjectsToStorage();

            applySearch();

            showToast(
                "Subject deleted."
            );
        }



        /* =====================================================
           SEARCH
           ===================================================== */

        function applySearch() {

            const input =
                document.getElementById(
                    "searchInput"
                );


            const query =
                input
                    ?
                    input.value
                        .trim()
                        .toLowerCase()
                    :
                    "";


            if (!query) {

                renderSubjects(
                    subjects
                );

                return;
            }


            const filtered =
                subjects.filter(
                    function(subject) {

                        return (

                            String(
                                subject.name || ""
                            )
                                .toLowerCase()
                                .includes(query)

                            ||

                            String(
                                subject.code || ""
                            )
                                .toLowerCase()
                                .includes(query)

                            ||

                            String(
                                subject.faculty || ""
                            )
                                .toLowerCase()
                                .includes(query)

                        );
                    }
                );


            renderSubjects(
                filtered
            );
        }



        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            applySearch
        );



        /* =====================================================
           DRAWER
           ===================================================== */

        function openDrawer() {

            const drawer =
                document.getElementById(
                    "drawer"
                );


            const overlay =
                document.getElementById(
                    "drawerOverlay"
                );


            drawer.classList.add(
                "show"
            );


            overlay.classList.add(
                "show"
            );
        }


        function closeDrawer() {

            const drawer =
                document.getElementById(
                    "drawer"
                );


            const overlay =
                document.getElementById(
                    "drawerOverlay"
                );


            drawer.classList.remove(
                "show"
            );


            overlay.classList.remove(
                "show"
            );
        }



        /* =====================================================
           NAVIGATION
           ===================================================== */

        function openCalendar() {

            window.location.href =
                "calendar.html";
        }


        function openNotifications() {

            window.location.href =
                "notifications.html";
        }



        /* =====================================================
           LOGOUT
           ===================================================== */

        function logout() {

            const confirmed =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (!confirmed) {

                return;
            }


            sessionStorage.removeItem(
                "duemate-user"
            );


            sessionStorage.removeItem(
                "duemate-user-name"
            );


            sessionStorage.removeItem(
                "duemate-user-email"
            );


            window.location.href =
                "index.html";
        }



        /* =====================================================
           TOAST
           ===================================================== */

        let toastTimer;


        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            if (!toast) {

                return;
            }


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2500
                );
        }



        /* =====================================================
           ESC KEY
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeDrawer();

                    closeSubjectModal();
                }

            }
        );



        /* =====================================================
           CLICK OUTSIDE MODAL
           ===================================================== */

        document.getElementById(
            "subjectModal"
        ).addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeSubjectModal();
                }

            }
        );



        /* =====================================================
           BACKGROUND PARALLAX
           ===================================================== */

        let mouseX = 0;

        let mouseY = 0;

        let smoothX = 0;

        let smoothY = 0;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (
                    window.innerWidth <=
                    700
                ) {

                    return;
                }


                mouseX =
                    event.clientX /
                    window.innerWidth -
                    0.5;


                mouseY =
                    event.clientY /
                    window.innerHeight -
                    0.5;

            }
        );


        function animateBackground() {

            smoothX +=
                (
                    mouseX -
                    smoothX
                ) * 0.025;


            smoothY +=
                (
                    mouseY -
                    smoothY
                ) * 0.025;


            const glows =
                document.querySelectorAll(
                    ".glow"
                );


            glows.forEach(
                function(glow, index) {

                    const depth =
                        (index + 1) * 5;


                    glow.style.marginLeft =
                        `${smoothX * depth}px`;


                    glow.style.marginTop =
                        `${smoothY * depth}px`;

                }
            );


            requestAnimationFrame(
                animateBackground
            );
        }


        animateBackground();



        /* =====================================================
           INITIALIZE
           ===================================================== */

        loadSubjects();

        renderSubjects();

        updateColorSelection();

    </script>

    <script src="app-shell.js"></script>
</body>

</html>
