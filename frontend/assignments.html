<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueMate - Assignments</title>
    <script src="config.js"></script>
    <link rel="stylesheet" href="app-shell.css">
    <style>
        :root { --ink:#202b38; --muted:#6d7885; --paper:#fffdf8; --line:#e8e1d5; --accent:#087f8c; --accent-dark:#075866; --ok:#198754; --warn:#b7791f; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:Georgia, 'Times New Roman', serif; color:var(--ink); background:linear-gradient(135deg,#f5efe5,#e6f3ef); }
        .page { max-width:1120px; margin:0 auto; padding:34px 22px 70px; }
        .top { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:28px; }
        h1 { margin:0 0 7px; font-size:clamp(32px,5vw,56px); font-weight:500; letter-spacing:0; }
        .intro { color:var(--muted); margin:0; font-family:Arial,sans-serif; }
        .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:2px; font:700 11px Arial,sans-serif; }
        .layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:24px; align-items:start; }
        .panel { background:rgba(255,253,248,.9); border:1px solid var(--line); border-radius:8px; padding:22px; box-shadow:0 12px 32px rgba(47,62,70,.09); }
        .panel h2 { margin:0 0 17px; font-size:23px; font-weight:500; }
        .assignment { padding:18px 0; border-top:1px solid var(--line); }
        .assignment:first-child { border-top:0; padding-top:0; }
        .assignment h3 { margin:0 0 6px; font-size:21px; font-weight:500; }
        .meta { color:var(--muted); font:13px Arial,sans-serif; line-height:1.55; }
        .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }
        button, .button { border:0; border-radius:5px; padding:10px 13px; cursor:pointer; background:var(--accent); color:#fff; font:700 12px Arial,sans-serif; text-decoration:none; }
        button.secondary, .button.secondary { background:#e5efec; color:var(--accent-dark); }
        button.warn { background:#b7791f; }
        button:disabled { opacity:.55; cursor:not-allowed; }
        label { display:block; margin:0 0 6px; font:700 12px Arial,sans-serif; color:var(--muted); }
        input, textarea { width:100%; border:1px solid var(--line); border-radius:5px; padding:11px; margin-bottom:13px; color:var(--ink); background:#fff; font:14px Arial,sans-serif; }
        textarea { min-height:80px; resize:vertical; }
        .status { display:inline-block; margin-left:6px; padding:4px 7px; border-radius:12px; background:#e8f4ed; color:var(--ok); font:700 11px Arial,sans-serif; }
        .status.needs_revision { background:#fff1dc; color:var(--warn); }
        .empty, .message { color:var(--muted); font:14px Arial,sans-serif; line-height:1.5; }
        .message { margin-top:12px; }
        .review { margin-top:13px; padding:12px; background:#f5f0e8; border-radius:5px; }
        @media (max-width:800px) { .layout { grid-template-columns:1fr; } .top { align-items:start; flex-direction:column; } }
    </style>
    <style>
        :root { --bg:#f5f6ff; --surface:rgba(255,255,255,.72); --surface-solid:#fff; --text:#25263a; --muted:#777b91; --border:rgba(255,255,255,.9); --purple:#756cff; --blue:#5d9cff; --pink:#ff86b6; --mint:#55d5b0; --yellow:#ffd76b; --grid:rgba(91,99,150,.055); --shadow:rgba(60,66,120,.14); --danger:#ff6f91; }
        body.dark { --bg:#0b1020; --surface:rgba(20,26,49,.72); --surface-solid:#151b32; --text:#f4f5ff; --muted:#aeb3ca; --border:rgba(255,255,255,.09); --purple:#958cff; --blue:#73adff; --pink:#ff91bf; --mint:#64dfc0; --yellow:#ffe08a; --grid:rgba(185,195,255,.035); --shadow:rgba(0,0,0,.42); }
        body { min-height:100vh; overflow-x:hidden; font-family:"Segoe UI",Inter,Arial,sans-serif; color:var(--text); background:var(--bg); transition:background .5s ease,color .5s ease; }
        .background { position:fixed; inset:0; z-index:-10; overflow:hidden; background:var(--bg); }
        .background .grid { position:absolute; inset:-100px; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:44px 44px; transform:perspective(500px) rotateX(55deg) scale(1.4); transform-origin:center bottom; mask-image:linear-gradient(to bottom,transparent 5%,black 35%,black 75%,transparent 100%); animation:assignmentsGridMove 30s linear infinite; }
        @keyframes assignmentsGridMove { from { background-position:0 0,0 0; } to { background-position:44px 44px,44px 44px; } }
        .background .glow { position:absolute; border-radius:50%; filter:blur(85px); pointer-events:none; opacity:.28; }
        .background .glow-one { width:430px; height:430px; left:-170px; top:-160px; background:var(--purple); animation:assignmentsGlowOne 18s ease-in-out infinite alternate; }
        .background .glow-two { width:400px; height:400px; right:-170px; top:25%; background:var(--mint); animation:assignmentsGlowTwo 22s ease-in-out infinite alternate; }
        .background .glow-three { width:380px; height:380px; left:35%; bottom:-220px; background:var(--pink); animation:assignmentsGlowThree 25s ease-in-out infinite alternate; }
        @keyframes assignmentsGlowOne { to { transform:translate(240px,230px) scale(1.15); } }
        @keyframes assignmentsGlowTwo { to { transform:translate(-220px,130px) scale(1.12); } }
        @keyframes assignmentsGlowThree { to { transform:translate(180px,-130px) scale(1.1); } }
        .background .study-float { position:absolute; pointer-events:none; user-select:none; opacity:.14; animation:assignmentsFloat 10s ease-in-out infinite; }
        .background .book-one { left:7%; top:20%; font-size:32px; }
        .background .book-two { right:7%; bottom:18%; font-size:30px; animation-delay:-4s; }
        .background .pencil { left:48%; top:12%; font-size:26px; animation-delay:-7s; }
        .background .calendar-float { right:18%; top:65%; font-size:27px; animation-delay:-2s; }
        @keyframes assignmentsFloat { 0%,100% { transform:translate3d(0,0,0) rotate(-5deg); } 50% { transform:translate3d(10px,-18px,0) rotate(7deg); } }
        .app-shell-staff-topbar { width:min(1180px,calc(100% - 44px)); margin:18px auto 28px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
        .app-shell-staff-topbar .left-top,.app-shell-staff-topbar .top-actions { display:flex; align-items:center; gap:10px; }
        .app-shell-staff-topbar .menu-btn,.app-shell-staff-topbar .top-actions button { width:45px; min-height:45px; padding:9px 12px; border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--text); box-shadow:0 12px 30px var(--shadow); backdrop-filter:blur(15px); transition:transform .25s ease,background .25s ease; }
        .app-shell-staff-topbar .menu-btn:hover,.app-shell-staff-topbar .top-actions button:hover { transform:translateY(-2px); background:rgba(117,108,255,.08); }
        .app-shell-staff-topbar .brand { font-size:26px; font-weight:800; letter-spacing:-1px; }
        .app-shell-staff-topbar .brand span { color:var(--purple); }
        .app-shell-staff-topbar .top-actions button[data-shell-date] { width:auto; min-width:132px; font-size:11px; font-weight:800; }
        .page { width:min(1180px,100%); max-width:none; margin:0 auto; padding:0 22px 70px; position:relative; }
        .top { display:block; margin:0 0 25px; }
        .eyebrow { color:var(--purple); font:800 10px "Segoe UI",Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
        h1 { margin:0 0 8px; color:var(--text); font:800 clamp(30px,5vw,46px)/1.08 "Segoe UI",Inter,Arial,sans-serif; letter-spacing:-1.7px; }
        .intro { color:var(--muted); font:14px "Segoe UI",Inter,Arial,sans-serif; }
        .layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:22px; align-items:start; }
        .panel { padding:22px; border:1px solid var(--border); border-radius:24px; background:var(--surface); box-shadow:0 18px 45px var(--shadow); backdrop-filter:blur(18px); animation:assignmentsCardFloat 7s ease-in-out infinite; }
        .layout .panel:nth-child(2) { animation-delay:-2.5s; }
        @keyframes assignmentsCardFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
        .panel h2 { margin:0 0 16px; color:var(--text); font:800 20px "Segoe UI",Inter,Arial,sans-serif; letter-spacing:-.5px; }
        .assignment { padding:16px 0; border-top:1px solid rgba(120,125,160,.12); }
        .assignment:first-child { border-top:0; padding-top:0; }
        .assignment h3 { margin:0 0 7px; color:var(--text); font:800 14px "Segoe UI",Inter,Arial,sans-serif; }
        .meta { color:var(--muted); font:11px/1.55 "Segoe UI",Inter,Arial,sans-serif; }
        .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }
        button,.button { border:0; border-radius:12px; padding:10px 13px; cursor:pointer; background:var(--purple); color:#fff; font:800 11px "Segoe UI",Inter,Arial,sans-serif; text-decoration:none; box-shadow:0 8px 20px rgba(117,108,255,.2); transition:transform .2s ease,background .2s ease; }
        button:hover,.button:hover { transform:translateY(-2px); }
        button.secondary,.button.secondary { background:rgba(117,108,255,.1); color:var(--purple); box-shadow:none; }
        button.warn { background:var(--danger); }
        button:disabled { opacity:.55; cursor:not-allowed; }
        label { display:block; margin:0 0 7px; color:var(--text); font:800 11px "Segoe UI",Inter,Arial,sans-serif; }
        input,select,textarea { width:100%; border:1px solid rgba(120,125,160,.18); border-radius:12px; padding:12px 13px; margin-bottom:15px; outline:none; color:var(--text); background:rgba(120,125,160,.055); font:12px "Segoe UI",Inter,Arial,sans-serif; transition:border-color .2s ease,box-shadow .2s ease; }
        input:focus,select:focus,textarea:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(117,108,255,.1); }
        input[type=file] { padding:10px; }
        textarea { min-height:100px; resize:vertical; }
        .status { display:inline-block; margin-left:6px; padding:4px 7px; border-radius:9px; background:rgba(85,213,176,.13); color:#159b78; font:800 9px "Segoe UI",Arial,sans-serif; }
        .status.needs_revision { background:rgba(255,215,107,.18); color:#b78616; }
        .empty,.message { color:var(--muted); font:11px/1.5 "Segoe UI",Inter,Arial,sans-serif; }
        .message { margin-top:12px; }
        .review { margin-top:13px; padding:12px; border:1px solid rgba(120,125,160,.1); border-radius:14px; background:rgba(120,125,160,.055); color:var(--text); font-size:11px; }
        @media (max-width:800px) { .app-shell-staff-topbar { width:calc(100% - 28px); margin:15px auto 24px; } .app-shell-staff-topbar .top-actions button[data-shell-date] { min-width:45px; width:45px; font-size:0; } .app-shell-staff-topbar .top-actions button[data-shell-date]::first-letter { font-size:20px; } .page { padding:0 14px 50px; } .layout { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="background"><div class="grid"></div><div class="glow glow-one"></div><div class="glow glow-two"></div><div class="glow glow-three"></div><div class="study-float book-one">📚</div><div class="study-float book-two">📖</div><div class="study-float pencil">✏️</div><div class="study-float calendar-float">📅</div></div>
    <main class="page">
        <header class="top">
            <div><div class="eyebrow">Academic exchange</div><h1>Assignments</h1><p class="intro" id="roleIntro">Loading your assignment desk...</p></div>
        </header>
        <div class="layout">
            <section class="panel"><h2 id="listTitle">Current assignments</h2><div id="assignmentList" class="empty">Loading assignments...</div></section>
            <aside class="panel" id="teacherPanel" hidden>
                <h2>Publish a PDF</h2>
                <form id="assignmentForm">
                    <label for="subject">Subject</label><input id="subject" required maxlength="255">
                    <label for="title">Assignment title</label><input id="title" required maxlength="255">
                    <label for="description">Instructions</label><textarea id="description" required></textarea>
                    <label for="assignmentFile">Assignment PDF</label><input id="assignmentFile" type="file" accept="application/pdf" required>
                    <label for="targetYear">Target year</label><select id="targetYear" required><option value="">Select year</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select>
                    <label for="dueDate">Due date</label><input id="dueDate" type="date" required>
                    <label for="dueTime">Due time</label><input id="dueTime" type="time" required>
                    <button type="submit">Publish assignment</button><div id="formMessage" class="message"></div>
                </form>
            </aside>
        </div>
    </main>
    <script src="app-shell.js?v=20260911"></script>
    <script>
        const API = window.API_BASE || "http://localhost:5000";
        const headers = () => ({ Authorization: "Bearer " + sessionStorage.getItem("duemate-token") });
        const list = document.getElementById("assignmentList");
        const teacherPanel = document.getElementById("teacherPanel");
        const message = document.getElementById("formMessage");
        let currentRole = "student";
        let assignmentCache = [];
        function esc(value) { return String(value || "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
        function showMessage(text, error = false) { message.textContent = text; message.style.color = error ? "#b42318" : "var(--ok)"; }
        function displayDate(value) { if (!value) return ""; const date = String(value).includes("T") ? new Date(value) : new Date(String(value) + "T00:00:00"); return Number.isNaN(date.getTime()) ? String(value) : date.toISOString().slice(0, 10); }
        async function loadAssignments() {
            const response = await fetch(API + "/api/assignments", { headers: headers() });
            const data = await response.json();
            if (response.status === 401) {
                sessionStorage.removeItem("duemate-token");
                window.location.href = "index.html";
                return;
            }
            if (!response.ok) throw new Error(data.message || "Unable to load assignments.");
            currentRole = data.role; assignmentCache = data.assignments || []; teacherPanel.hidden = currentRole !== "teacher";
            document.getElementById("roleIntro").textContent = currentRole === "teacher" ? "Publish work, open student submissions, and complete reviews." : "Read the brief, open the PDF, and submit your completed work.";
            document.getElementById("listTitle").textContent = currentRole === "teacher" ? "Published assignments" : "Available assignments";
            if (!data.assignments.length) { list.innerHTML = '<div class="empty">No assignments have been published yet.</div>'; return; }
            list.innerHTML = data.assignments.map(assignment => currentRole === "teacher" ? teacherCard(assignment) : studentCard(assignment)).join("");
            bindActions();
        }
        function studentCard(a) { const state = a.assignment_status ? `<span class="status ${esc(a.assignment_status)}">${esc(a.assignment_status.replace("_", " "))}</span>` : ""; return `<article class="assignment"><h3>${esc(a.title)} ${state}</h3><div class="meta">${esc(a.subject || "General")} ${a.due_date ? "· Due " + esc(displayDate(a.due_date)) + (a.due_time ? " at " + esc(String(a.due_time).slice(0, 5)) : "") : ""}<br>${esc(a.description || "No instructions provided.")}</div><div class="actions"><button class="secondary pdf-btn" data-url="/api/assignments/${encodeURIComponent(a.id)}/file">View assignment PDF</button><label class="button" style="display:inline-block">Submit PDF<input class="submit-file" data-id="${esc(a.id)}" type="file" accept="application/pdf" hidden></label></div>${a.submission_feedback ? `<div class="review">Feedback: ${esc(a.submission_feedback)}</div>` : ""}</article>`; }
        function teacherCard(a) { const state = a.assignment_status ? `<span class="status ${esc(a.assignment_status)}">${esc(a.assignment_status.replace("_", " "))}</span>` : ""; const deadline = a.due_date ? `Due ${esc(displayDate(a.due_date))}${a.due_time ? " at " + esc(String(a.due_time).slice(0, 5)) : ""}` : "No deadline"; return `<article class="assignment"><h3>${esc(a.subject || "General")} · ${esc(a.title)} ${state}</h3><div class="meta">${deadline} · Year ${esc(a.target_year)}<br>${esc(a.description || "No instructions provided.")}<br>File: ${esc(a.file_name || "Uploaded PDF")} · ${a.submission_count || 0} submission(s)</div><div class="actions"><button class="secondary pdf-btn" data-url="/api/assignments/${encodeURIComponent(a.id)}/file">Open PDF</button><button class="review-btn" data-id="${esc(a.id)}">Review submissions</button><button class="secondary edit-btn" data-id="${esc(a.id)}">Edit</button><button class="warn delete-btn" data-id="${esc(a.id)}">Delete</button></div><div id="reviews-${esc(a.id)}"></div></article>`; }
        function bindActions() { document.querySelectorAll(".submit-file").forEach(input => input.addEventListener("change", () => submitFile(input))); document.querySelectorAll(".review-btn").forEach(button => button.addEventListener("click", () => loadReviews(button.dataset.id))); document.querySelectorAll(".pdf-btn").forEach(button => button.addEventListener("click", () => openPdf(button.dataset.url))); document.querySelectorAll(".delete-btn").forEach(button => button.addEventListener("click", () => deleteAssignment(button.dataset.id))); document.querySelectorAll(".edit-btn").forEach(button => button.addEventListener("click", () => editAssignment(button.dataset.id))); }
        async function deleteAssignment(id) { if (!confirm("Delete this assignment?")) return; const response = await fetch(API + "/api/assignments/" + encodeURIComponent(id), { method:"DELETE", headers:headers() }); const data = await response.json(); if (!response.ok) alert(data.message || "Delete failed."); else loadAssignments(); }
        async function editAssignment(id) { const assignment = assignmentCache.find(item => String(item.id) === String(id)); if (!assignment) return; const title = prompt("Assignment title:", assignment.title || ""); if (!title) return; const subject = prompt("Subject:", assignment.subject || ""); if (!subject) return; const description = prompt("Instructions:", assignment.description || ""); if (description === null) return; const targetYear = prompt("Target year (1-4):", assignment.target_year || ""); if (!targetYear) return; const dueDate = prompt("Due date (YYYY-MM-DD):", assignment.due_date || ""); if (!dueDate) return; const dueTime = prompt("Due time (HH:MM):", assignment.due_time ? String(assignment.due_time).slice(0, 5) : ""); if (!dueTime) return; const response = await fetch(API + "/api/assignments/" + encodeURIComponent(id), { method:"PATCH", headers:{ ...headers(), "Content-Type":"application/json" }, body:JSON.stringify({ title, subject, description, targetYear, dueDate, dueTime }) }); const data = await response.json(); if (!response.ok) alert(data.message || "Update failed."); else loadAssignments(); }
        async function openPdf(url) { const response = await fetch(API + url, { headers: headers() }); if (!response.ok) { alert("Unable to open this PDF."); return; } const blobUrl = URL.createObjectURL(await response.blob()); window.open(blobUrl, "_blank", "noopener"); }
        async function submitFile(input) { const file = input.files[0]; if (!file) return; const form = new FormData(); form.append("file", file); const response = await fetch(API + "/api/assignments/" + encodeURIComponent(input.dataset.id) + "/submissions", { method:"POST", headers: { Authorization: headers().Authorization }, body:form }); const data = await response.json(); if (!response.ok) alert(data.message || "Submission failed."); else loadAssignments(); }
        async function loadReviews(id) { const target = document.getElementById("reviews-" + id); const response = await fetch(API + "/api/assignments/" + encodeURIComponent(id) + "/submissions", { headers: headers() }); const data = await response.json(); if (!response.ok) { target.textContent = data.message; return; } target.innerHTML = data.submissions.length ? data.submissions.map(s => `<div class="review"><strong>${esc(s.student_email)}</strong><span class="status ${esc(s.status)}">${esc(s.status.replace("_", " "))}</span><div class="actions"><button class="secondary submission-pdf-btn" data-id="${esc(s.id)}">View submission</button><button class="complete-btn" data-assignment="${esc(id)}" data-submission="${esc(s.id)}">Mark completed</button><button class="revision-btn warn" data-assignment="${esc(id)}" data-submission="${esc(s.id)}">Needs revision</button></div></div>`).join("") : '<div class="review">No submissions yet.</div>'; target.querySelectorAll(".complete-btn, .revision-btn").forEach(button => button.addEventListener("click", () => updateReview(button))); target.querySelectorAll(".submission-pdf-btn").forEach(button => button.addEventListener("click", () => openPdf("/api/assignments/submissions/" + encodeURIComponent(button.dataset.id) + "/file"))); }
        async function updateReview(button) { const feedback = prompt("Feedback for the student (optional):", ""); if (feedback === null) return; const status = button.classList.contains("complete-btn") ? "completed" : "needs_revision"; const response = await fetch(API + "/api/assignments/" + button.dataset.assignment + "/submissions/" + button.dataset.submission, { method:"PATCH", headers:{ ...headers(), "Content-Type":"application/json" }, body:JSON.stringify({ status, feedback }) }); const data = await response.json(); if (!response.ok) alert(data.message || "Review failed."); else loadReviews(button.dataset.assignment); }
        document.getElementById("assignmentForm").addEventListener("submit", async event => { event.preventDefault(); const file = document.getElementById("assignmentFile").files[0]; const form = new FormData(); form.append("title", document.getElementById("title").value); form.append("subject", document.getElementById("subject").value); form.append("dueDate", document.getElementById("dueDate").value); form.append("dueTime", document.getElementById("dueTime").value); form.append("targetYear", document.getElementById("targetYear").value); form.append("description", document.getElementById("description").value); form.append("file", file); const response = await fetch(API + "/api/assignments", { method:"POST", headers:{ Authorization: headers().Authorization }, body:form }); const data = await response.json(); if (!response.ok) showMessage(data.message || "Publishing failed.", true); else { showMessage("Assignment published."); event.target.reset(); loadAssignments(); } });
        loadAssignments().catch(error => { list.textContent = error.message; });
    </script>
</body>
</html>
