<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DueMate - Students</title><script src="config.js"></script><link rel="stylesheet" href="app-shell.css"><style>
:root{--ink:#202b38;--muted:#6d7885;--paper:#fffdf8;--line:#e8e1d5;--accent:#087f8c;--accent-dark:#075866}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(135deg,#f5efe5,#e6f3ef)}.page{max-width:1120px;margin:0 auto;padding:24px 22px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:25px;font-weight:700;color:var(--accent-dark)}.brand span{color:var(--accent)}.topbar button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:9px 12px;margin-left:6px;cursor:pointer}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font:700 11px Arial,sans-serif}h1{margin:6px 0;font-size:clamp(32px,5vw,54px);font-weight:500}.intro{color:var(--muted);font:14px Arial,sans-serif}.toolbar{display:flex;gap:10px;margin:22px 0}.toolbar input{flex:1;padding:12px;border:1px solid var(--line);border-radius:5px}.panel{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 12px 32px rgba(47,62,70,.08)}table{width:100%;border-collapse:collapse;font:14px Arial,sans-serif}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{color:var(--muted);font:14px Arial,sans-serif}@media(max-width:650px){.topbar{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}table{font-size:12px}th,td{padding:10px 5px}}
</style></head><body class="staff-page"><div class="background"><div class="grid"></div><div class="glow glow-one"></div><div class="glow glow-two"></div><div class="glow glow-three"></div><div class="study-float book-one">ðŸ“š</div><div class="study-float book-two">ðŸ“–</div><div class="study-float pencil">âœï¸</div><div class="study-float calendar-float">ðŸ“…</div></div><main class="page"><div class="eyebrow">Staff directory</div><h1>Students</h1><p class="intro" id="scope">Loading your College and Department...</p><div class="toolbar"><input id="search" placeholder="Search students by name or email"></div><section class="panel"><div id="students" class="empty">Loading students...</div></section></main><script src="app-shell.js?v=20260917"></script><script>
const API=window.API_BASE||'http://localhost:5000';const auth=()=>({Authorization:'Bearer '+sessionStorage.getItem('duemate-token')});let rows=[];function esc(v){return String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const q=document.getElementById('search').value.toLowerCase();const data=rows.filter(s=>(s.name+' '+s.email).toLowerCase().includes(q));document.getElementById('students').innerHTML=data.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Year</th><th>College</th><th>Department</th></tr></thead><tbody>${data.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.year)}</td><td>${esc(s.college)}</td><td>${esc(s.department)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No students found in this College and Department.</div>'}document.getElementById('search').addEventListener('input',render);(async()=>{document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{day:'2-digit',month:'short',weekday:'short'});try{const [c,s]=await Promise.all([fetch(API+'/api/staff/context',{headers:auth()}),fetch(API+'/api/staff/students',{headers:auth()})]);const context=await c.json(),data=await s.json();if(!c.ok||!s.ok)throw new Error(data.message||context.message);document.getElementById('scope').textContent=`${context.staff.college} Â· ${context.staff.department} Â· All years`;rows=data.students;render()}catch(e){document.getElementById('students').textContent=e.message}})();
</script></body></html>
